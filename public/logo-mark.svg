  <title id="logo-title">Sheet Happens Officer — editable vector logo</title>
  <desc id="logo-description">Vector reconstruction of the selected generated logo. Task-list mascot with raised eyebrow, grin, gold pencil and folded corner. Brand colours #2C2F71 and #D99D29. All lettering is outlined; no embedded raster image or font dependency.</desc>
