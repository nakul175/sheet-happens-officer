# Concierge evaluation set (SHO-US-21.2). Manual only: it does not run on push and it does not deploy.
# Required before merging changes under src/lib/concierge/, src/lib/model.ts, or tests/eval/.
# See tests/eval/README.md.
#
# Secret (this job only): CONCIERGE_EVAL_API_KEY — the provider key. Never printed.
# Variables: MODEL_NAME (primary, optional), MODEL_NAME_SECOND (required when the input is secondary).
# For a second model that is not claude-haiku-5-5, also set MODEL_USD_IN_PER_MTOK and MODEL_USD_OUT_PER_MTOK.
name: Concierge evaluation set

on:
  workflow_dispatch:
    inputs:
      model:
        description: "primary uses MODEL_NAME (default claude-haiku-5-5). secondary uses MODEL_NAME_SECOND."
        type: choice
        required: true
        default: primary
        options:
          - primary
          - secondary

permissions:
  contents: read

concurrency:
  group: concierge-eval
  cancel-in-progress: false

jobs:
  eval:
    name: Replay the concierge eval set
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: sho
          POSTGRES_PASSWORD: sho
          POSTGRES_DB: sho_eval
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U sho"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      CONCIERGE_EVAL: "1"
      NODE_ENV: test
      DATABASE_URL: postgresql://sho:sho@localhost:5432/sho_eval?schema=public
      DIRECT_DATABASE_URL: postgresql://sho:sho@localhost:5432/sho_eval?schema=public
      MODEL_PROVIDER: anthropic
      MODEL_DATA_APPROVED: "true"
      EVAL_MODEL_SLOT: ${{ inputs.model }}
      MODEL_NAME: ${{ inputs.model == 'secondary' && vars.MODEL_NAME_SECOND || vars.MODEL_NAME || 'claude-haiku-5-5' }}
      MODEL_NAME_SECOND: ${{ vars.MODEL_NAME_SECOND }}
      MODEL_USD_IN_PER_MTOK: ${{ vars.MODEL_USD_IN_PER_MTOK }}
      MODEL_USD_OUT_PER_MTOK: ${{ vars.MODEL_USD_OUT_PER_MTOK }}
      MODEL_USD_CACHE_WRITE_PER_MTOK: ${{ vars.MODEL_USD_CACHE_WRITE_PER_MTOK }}
      MODEL_USD_CACHE_READ_PER_MTOK: ${{ vars.MODEL_USD_CACHE_READ_PER_MTOK }}
      ANTHROPIC_API_KEY: ${{ secrets.CONCIERGE_EVAL_API_KEY }}
      MODEL_RETRY_DELAY_MS: "0"
      MODEL_TIMEOUT_MS: "30000"
      WEEKLY_MESSAGE_CAP: "10000"
      MONTHLY_CEILING_USD: "1000"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma migrate deploy
      - name: Require the eval provider key
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "GitHub secret CONCIERGE_EVAL_API_KEY is not set. Add it in repository secrets. The value is not printed."
            exit 1
          fi
          echo "CONCIERGE_EVAL_API_KEY is set."
      - run: npm run eval:concierge
      - name: Name the artifact after the model
        if: always()
        id: artifact
        run: |
          if [ -f tests/eval/out/model-name.txt ]; then
            name=$(tr -cd 'A-Za-z0-9._-' < tests/eval/out/model-name.txt | head -c 80)
          else
            name=unknown
          fi
          echo "name=concierge-eval-${name}" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ steps.artifact.outputs.name }}
          path: tests/eval/out/*
          if-no-files-found: warn
