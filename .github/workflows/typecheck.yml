# APL-2676. Typecheck every pull request to main.
# A non-zero exit fails this check. Not a deploy or production workflow.
name: Typecheck

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  typecheck:
    name: npm run typecheck
    runs-on: ubuntu-latest
    env:
      # prisma generate during npm ci reads this and does not connect.
      DATABASE_URL: postgresql://sho:sho@127.0.0.1:5432/unused?schema=public
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
