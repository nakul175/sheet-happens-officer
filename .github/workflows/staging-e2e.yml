# Story-level Playwright specs (tests/e2e/stories) against staging or a pr1-pr8 preview (input "target", checked against TARGET_ALLOWLIST;
# production is refused). Started by hand only (Actions > Staging e2e > Run workflow).
# The specs live on the branch the run is started from ("Use workflow from", e.g. qa/story-e2e): every job checks out that same commit.
# Input "specs": space-separated issue ids (APL-2481) or globs (APL-26*, tests/e2e/stories/APL-25*.spec.ts); empty runs every spec.
# Secrets (repository settings): STAGING_USER, STAGING_PASS, SHO_QA_PASS, SHO_ADMIN_EMAIL, SHO_ADMIN_PASS, SHO_MEMBER_EMAIL,
# SHO_MEMBER_PASS, and ZZ_TEST_01_EMAIL / ZZ_TEST_01_PASS ... ZZ_TEST_20_EMAIL / ZZ_TEST_20_PASS (01-05 Super Admins, 06-20 plain Members).
# SHO_QA_PASS is the shared password for the nakul17+ story accounts. Without it the harness gate (qa-alias gateFile) fails the spec.
# Those accounts are a fixed pool of already verified aliases (APL-2748, tests/e2e/helpers/alias-pool.ts): the Super Admin
# nakul17+zz-sa plus 3 Members per job, nakul17+zz-qa-<QA_SLOT>-1..3. QA_SLOT is the shard's nn, or "serial", so two jobs
# never share a person. No spec signs up or verifies an account; tests/e2e/tools/provision-aliases.ts sets the pool up once.
# The previews use the same STAGING_USER / STAGING_PASS basic-auth gate as staging.
# They reach the jobs as environment variables only and are never echoed. Runs queue in one group so two never run at once.
# This workflow is workflow_dispatch only. It does not run on pull_request or pull_request_target, so a fork cannot read these secrets.
#
# How a run is split:
#   plan        checks "target" first, then picks the spec files once and splits them into the parallel set and SERIAL_SPECS.
#               Every shard and the serial job get BASE_URL=https://<target>.
#   e2e         20 shards of the parallel set (--shard=N/20, workers=1 each). Shard N signs in as ZZ_TEST_NN (SHARD_*), names its
#               data ZZ-TEST-NN (ZZ_PREFIX), and gets a partner account of the other role (PEER_*). At most max_parallel run at once.
#               A shard with no tests passes. A shard whose tests were all skipped fails. Each shard uploads its JSON counts.
#   e2e-serial  the SERIAL_SPECS files, alone, after every shard has finished, as the shared SHO_ADMIN / SHO_MEMBER accounts.
#               The same per-job rule applies, and it uploads its JSON counts too.
#   counts      once, after every shard (if: always(), needs plan). Expected count files come from plan:
#               20 when the parallel matrix runs, plus 1 when serial specs were picked. Fewer files, a failed
#               download, or a missing-report marker fails the job. It also fails when run is 0 or skipped equals total.
#   report      merges every job's blob report into one HTML report.

#
# max_parallel: the staging database is shared with production and allows 25 connections. Do not raise it above 5 until NJ approves
# a connection pool (PgBouncer) or a bigger database.
#
# Traces are OFF unless the "trace" input asks for them. A trace cannot be redacted: it holds the sign-in request body (the password),
# the basic-auth header (STAGING_USER:STAGING_PASS in base64, which GitHub's log masking does not catch) and any password typed into a
# field (APL-2476). With traces on, the uploaded reports carry those secrets to anyone who can download the run's artifacts.
name: Staging e2e

on:
  workflow_dispatch:
    inputs:
      specs:
        description: "Issue ids or globs, space-separated (e.g. APL-2481 APL-26*). Empty = all specs."
        required: false
        default: ""
        type: string
      trace:
        description: "Playwright traces. They contain passwords (see the comment at the top of this file)."
        required: false
        default: "off"
        type: choice
        options: ["off", "retain-on-failure"]
      target:
        description: "Host to test: staging.sheethappensofficer.com or pr1-pr8.staging.sheethappensofficer.com. Production is refused."
        required: false
        default: staging.sheethappensofficer.com
        type: string
      max_parallel:
        description: "Shards running at once (1-20). The staging DB has 25 connections: keep 5 until NJ approves a pool."
        required: false
        default: 5
        type: number
      probe:
        description: "on = run the read-only identity probe job only (no shards, no sign-in as a pool account, no POST that writes). Every other job is skipped."
        required: false
        default: "off"
        type: choice
        options: ["off", "on"]

permissions:
  contents: read

concurrency:
  group: staging-e2e
  cancel-in-progress: false

env:
  # The only hosts a run may target: staging, or Oscar's preview slots pr1-pr8. Matched against the whole host.
  TARGET_ALLOWLIST: '^(staging\.sheethappensofficer\.com|pr[1-8]\.staging\.sheethappensofficer\.com)$'
  # Only for `prisma generate` during npm ci; nothing connects to it.
  DATABASE_URL: postgresql://unused:unused@127.0.0.1:1/unused
  DIRECT_DATABASE_URL: postgresql://unused:unused@127.0.0.1:1/unused
  PLAYWRIGHT_HTML_OPEN: never
  # Specs that read or change org-wide state another shard would disturb (counts, Trash, Activity, people, notifications, a shared
  # account's password or sessions), so they run in the e2e-serial job, alone. APL-2610 covers APL-2671 too. Ids are file names.
  SERIAL_SPECS: >-
    APL-2479 APL-2483 APL-2521 APL-2542-totals APL-2572 APL-2609 APL-2610 APL-2640 APL-2649

jobs:
  plan:
    name: Pick the spec files
    if: inputs.probe != 'on'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      base_url: ${{ steps.target.outputs.base_url }}
      parallel: ${{ steps.pick.outputs.parallel }}
      serial: ${{ steps.pick.outputs.serial }}
      expected_counts: ${{ steps.pick.outputs.expected_counts }}
    steps:
      - name: Check the target host
        id: target
        env:
          TARGET: ${{ inputs.target }}
        run: |
          if [[ "${TARGET,,}" =~ ^(www\.|app\.)?sheethappensofficer\.com\.?$ ]]; then
            echo "::error::Refusing to run against production ($TARGET)."; exit 1
          fi
          if ! [[ "$TARGET" =~ $TARGET_ALLOWLIST ]]; then
            echo "::error::Target '$TARGET' is not allowed. Use staging.sheethappensofficer.com or pr1-pr8.staging.sheethappensofficer.com."; exit 1
          fi
          echo "Target: https://$TARGET"
          echo "base_url=https://$TARGET" >> "$GITHUB_OUTPUT"
          # The seed step below runs only for a pr1-pr8 preview slot (APL-2590).
          if [[ "$TARGET" =~ ^pr[1-8]\.staging\.sheethappensofficer\.com$ ]]; then pr_slot=true; else pr_slot=false; fi
          echo "pr_slot=$pr_slot" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4

      - name: Check max_parallel
        env:
          MAX_PARALLEL: ${{ inputs.max_parallel }}
        run: |
          if ! [[ "$MAX_PARALLEL" =~ ^[0-9]+$ ]] || [ "$MAX_PARALLEL" -lt 1 ] || [ "$MAX_PARALLEL" -gt 20 ]; then
            echo "::error::max_parallel must be a whole number from 1 to 20 (got: $MAX_PARALLEL)."; exit 1
          fi
          if [ "$MAX_PARALLEL" -gt 5 ]; then
            echo "::warning::max_parallel=$MAX_PARALLEL. The staging DB has 25 connections; above 5 needs NJ's approval of a DB pool."
          fi

      - name: Split them into parallel and serial
        id: pick
        env:
          SPECS: ${{ inputs.specs }}
        run: |
          shopt -s nullglob
          # APL-2883: Vitest story specs (npm test runs them) are never picked. The list is tests/e2e/vitest-specs.cjs, the same
          # VITEST_SPECS playwright.config.ts ignores; a spec Playwright ignores would only end the run in "No tests found".
          vitest_specs=$(node -e 'process.stdout.write(require("./tests/e2e/vitest-specs.cjs").vitestSpecFiles().join(" "))')
          is_vitest() { [[ " $vitest_specs " == *" $(basename "$1") "* ]]; }
          echo "Vitest story specs, never picked: ${vitest_specs:-none}"
          files=()
          read -ra toks <<< "$SPECS"   # split on spaces without expanding globs against the repo root
          for tok in "${toks[@]}"; do
            if ! [[ "$tok" =~ ^[A-Za-z0-9_.*?/-]+$ ]] || [[ "$tok" == *..* ]]; then
              echo "::error::Not an issue id or glob: $tok"; exit 1
            fi
            if [[ "$tok" =~ ^[A-Za-z]+-[0-9]+$ ]]; then
              pattern="tests/e2e/stories/${tok^^}.spec.ts tests/e2e/stories/${tok^^}-*.spec.ts"   # an issue's split files too
            elif [[ "$tok" == */* ]]; then
              pattern="$tok"
            else
              pattern="tests/e2e/stories/$tok"
              [[ "$pattern" == *.ts ]] || pattern="$pattern.spec.ts"
            fi
            matched=(); vitest_hit=()
            for f in $pattern; do
              [[ -f "$f" && "$f" == tests/e2e/stories/*.spec.ts ]] || continue
              if is_vitest "$f"; then vitest_hit+=("$f"); else matched+=("$f"); fi
            done
            if [ ${#matched[@]} -eq 0 ] && [ ${#vitest_hit[@]} -gt 0 ]; then
              echo "::error::$tok selects only Vitest story specs (${vitest_hit[*]}). npm test runs them; Playwright ignores them (VITEST_SPECS)."; exit 1
            fi
            if [ ${#matched[@]} -eq 0 ]; then echo "::error::No spec file matches: $tok"; exit 1; fi
            [ ${#vitest_hit[@]} -eq 0 ] || echo "$tok: left out Vitest story specs ${vitest_hit[*]}"
            files+=("${matched[@]}")
          done
          if [ ${#files[@]} -eq 0 ]; then
            for f in tests/e2e/stories/*.spec.ts; do is_vitest "$f" || files+=("$f"); done
            [ ${#files[@]} -gt 0 ] || { echo "::error::No Playwright spec files in tests/e2e/stories on this branch (Vitest specs are not picked). Start the run from the branch with the specs (e.g. qa/story-e2e)."; exit 1; }
          fi
          parallel=(); serial=()
          for f in $(printf '%s\n' "${files[@]}" | sort -u); do
            id=$(basename "$f" .spec.ts)
            if [[ " $SERIAL_SPECS " == *" $id "* ]]; then serial+=("$f"); else parallel+=("$f"); fi
          done
          echo "Parallel shards (${#parallel[@]} files):"; printf '  %s\n' "${parallel[@]}"
          echo "Serial job (${#serial[@]} files):"; printf '  %s\n' "${serial[@]}"
          echo "parallel=${parallel[*]}" >> "$GITHUB_OUTPUT"
          echo "serial=${serial[*]}" >> "$GITHUB_OUTPUT"
          expected=$(node scripts/ci/assert-playwright-ran.mjs --mode expected --parallel "${#parallel[@]}" --serial "${#serial[@]}")
          echo "Count files expected: $expected"
          echo "expected_counts=$expected" >> "$GITHUB_OUTPUT"

      # APL-2590: the seed runs once here, before any shard starts. pr1-pr8 only; staging and production are refused.
      - uses: actions/setup-node@v4
        if: steps.target.outputs.pr_slot == 'true'
        with:
          node-version: 22
          cache: npm

      - name: Seed APL-2590 fixtures (pr slots only)
        if: steps.target.outputs.pr_slot == 'true'
        env:
          TARGET: ${{ inputs.target }}
          SEED_DATABASE_URL: ${{ secrets.SHO_PR_SLOT_DATABASE_URL }}
          SHO_QA_PASS: ${{ secrets.SHO_QA_PASS }}
        run: |
          # Never prints the URL or the password: no set -x, no env dump; parts of the URL are masked before any check.
          if ! [[ "$TARGET" =~ ^pr([1-8])\.staging\.sheethappensofficer\.com$ ]]; then
            echo "::error::Refusing to seed '$TARGET': only pr1-pr8.staging.sheethappensofficer.com (never staging or production)."; exit 1
          fi
          slot="pr${BASH_REMATCH[1]}"; want_schema="sho_${slot}"
          # AC23(a): never seed with NODE_ENV=production (APL-2590 D4).
          if [ "${NODE_ENV,,}" = production ]; then
            echo "::error::NODE_ENV=production. Refusing to seed."; exit 1
          fi
          url="$SEED_DATABASE_URL"
          if [ -z "$url" ]; then
            echo "::error::SHO_PR_SLOT_DATABASE_URL is missing or empty. Refusing to seed."; exit 1
          fi
          # ::add-mask:: masks one line and the checks below read one line, so a line break would get past both (APL-2590 D3).
          # Mask every line of both secrets first, then refuse any secret with a line break.
          for secret in "$SEED_DATABASE_URL" "$SHO_QA_PASS"; do
            while IFS= read -r line || [ -n "$line" ]; do
              [ -z "$line" ] || echo "::add-mask::$line"
            done < <(printf '%s' "$secret" | tr '\r' '\n')
          done
          if [[ "$SEED_DATABASE_URL$SHO_QA_PASS" == *[$'\n\r']* ]]; then
            echo "::error::SHO_PR_SLOT_DATABASE_URL or SHO_QA_PASS contains a line break. Refusing to seed."; exit 1
          fi
          echo "::add-mask::$url"
          rest="${url#*://}"; authority="${rest%%[/?#]*}"; userinfo=""; [[ "$authority" == *@* ]] && userinfo="${authority%@*}"
          [[ "$userinfo" == *:* ]] && echo "::add-mask::${userinfo#*:}"
          hostport="${authority##*@}"; host="${hostport%:*}"; host="${host,,}"; host="${host%.}"
          path="${rest#"$authority"}"; path="${path%%#*}"; db="${path%%\?*}"; db="${db#/}"
          query=""; [[ "$path" == *\?* ]] && query="${path#*\?}"
          if [[ "$url" == *unused:unused@127.0.0.1* || "$host" == 127.0.0.1 || "$host" == localhost || "$host" == "::1" || "$host" == "[::1]" ]]; then
            echo "::error::SHO_PR_SLOT_DATABASE_URL is still the placeholder or a local host. Refusing to seed."; exit 1
          fi
          # AC23(a) allowlist, matched exactly (APL-2590 D1): the one staging DB host (#128's STAGING_DB_HOSTS) and the sho_staging DB.
          # Anything else is refused: multi-host lists, IP forms, sslip/nip names, production, a port-less look-alike.
          # The whole host:port is matched, so "host:1,other" and "[::ffff:...]" cannot pass on a stripped port.
          if ! [[ "${hostport,,}" =~ ^private-sho-db-do-user-45345612-0\.k\.db\.ondigitalocean\.com\.?(:[0-9]{1,5})?$ ]]; then
            echo "::error::SHO_PR_SLOT_DATABASE_URL host is not the staging DB host. Refusing to seed."; exit 1
          fi
          if [ "$db" != sho_staging ]; then
            echo "::error::SHO_PR_SLOT_DATABASE_URL DB name is not sho_staging. Refusing to seed."; exit 1
          fi
          # As #128's guard: a query override moves the connection after the host and DB name above are read (APL-2590 D2).
          # options can set search_path, which would move the schema checked below.
          schemas=()
          IFS='&' read -ra params <<< "$query"
          for kv in "${params[@]}"; do
            key="${kv%%=*}"; key="${key,,}"
            case "$key" in
              host|hostaddr|dbname|options|*%*)
                echo "::error::SHO_PR_SLOT_DATABASE_URL overrides the host, DB name or search path in its query. Refusing to seed."; exit 1;;
              schema) [ "${kv%%=*}" = schema ] || { echo "::error::SHO_PR_SLOT_DATABASE_URL must spell the schema key in lower case. Refusing to seed."; exit 1; }; schemas+=("${kv#*=}");;
            esac
          done
          # One secret serves every slot, so the schema must be this slot's own: sho_pr<N>, never public or missing (APL-2590 D1).
          if [ "${#schemas[@]}" -ne 1 ] || [ "${schemas[0]}" != "$want_schema" ]; then
            echo "::error::SHO_PR_SLOT_DATABASE_URL must set ?schema=$want_schema (exactly once) for $slot. Refusing to seed."; exit 1
          fi
          if [ -z "$SHO_QA_PASS" ]; then
            echo "::error::SHO_QA_PASS is missing. Refusing to seed."; exit 1
          fi
          if [ ! -f scripts/seed-apl2590-fixtures.ts ]; then
            echo "::error::scripts/seed-apl2590-fixtures.ts is not on this ref (it is on #128's branch). Start the run from a ref that has it."; exit 1
          fi
          # npm ci runs install scripts: it gets neither secret (APL-2590 D2).
          env -u SEED_DATABASE_URL -u SHO_QA_PASS npm ci
          DATABASE_URL="$url" SEED_TARGET=staging SEED_PR_SLOT="$slot" npx tsx scripts/seed-apl2590-fixtures.ts

  e2e:
    name: Shard ${{ matrix.nn }} of 20 (${{ matrix.role }})
    needs: plan
    if: needs.plan.outputs.parallel != ''
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: ${{ fromJSON(inputs.max_parallel || '5') }}
      matrix:
        # nn picks the shard's own ZZ_TEST_NN account; peer is the partner of the other role (shard N with N+5, members with 01-05),
        # chosen so no two of any 5 consecutive shards share an account.
        include:
          - { shard:  1, nn: '01', role: ADMIN,  peer: '06' }
          - { shard:  2, nn: '02', role: ADMIN,  peer: '07' }
          - { shard:  3, nn: '03', role: ADMIN,  peer: '08' }
          - { shard:  4, nn: '04', role: ADMIN,  peer: '09' }
          - { shard:  5, nn: '05', role: ADMIN,  peer: '10' }
          - { shard:  6, nn: '06', role: MEMBER, peer: '01' }
          - { shard:  7, nn: '07', role: MEMBER, peer: '02' }
          - { shard:  8, nn: '08', role: MEMBER, peer: '03' }
          - { shard:  9, nn: '09', role: MEMBER, peer: '04' }
          - { shard: 10, nn: '10', role: MEMBER, peer: '05' }
          - { shard: 11, nn: '11', role: MEMBER, peer: '01' }
          - { shard: 12, nn: '12', role: MEMBER, peer: '02' }
          - { shard: 13, nn: '13', role: MEMBER, peer: '03' }
          - { shard: 14, nn: '14', role: MEMBER, peer: '04' }
          - { shard: 15, nn: '15', role: MEMBER, peer: '05' }
          - { shard: 16, nn: '16', role: MEMBER, peer: '01' }
          - { shard: 17, nn: '17', role: MEMBER, peer: '02' }
          - { shard: 18, nn: '18', role: MEMBER, peer: '03' }
          - { shard: 19, nn: '19', role: MEMBER, peer: '04' }
          - { shard: 20, nn: '20', role: MEMBER, peer: '05' }
    env:
      BASE_URL: ${{ needs.plan.outputs.base_url }}
      ZZ_PREFIX: ZZ-TEST-${{ matrix.nn }}
      SHARD_ROLE: ${{ matrix.role }}
      PEER_ROLE: ${{ matrix.role == 'ADMIN' && 'MEMBER' || 'ADMIN' }}
    steps:
      - name: Check the secrets are set (names only, never values)
        env:
          STAGING_USER: ${{ secrets.STAGING_USER }}
          STAGING_PASS: ${{ secrets.STAGING_PASS }}
          SHO_ADMIN_EMAIL: ${{ secrets.SHO_ADMIN_EMAIL }}
          SHO_ADMIN_PASS: ${{ secrets.SHO_ADMIN_PASS }}
          SHO_MEMBER_EMAIL: ${{ secrets.SHO_MEMBER_EMAIL }}
          SHO_MEMBER_PASS: ${{ secrets.SHO_MEMBER_PASS }}
          SHO_QA_PASS: ${{ secrets.SHO_QA_PASS }}
          SHARD_EMAIL: ${{ secrets[format('ZZ_TEST_{0}_EMAIL', matrix.nn)] }}
          SHARD_PASS: ${{ secrets[format('ZZ_TEST_{0}_PASS', matrix.nn)] }}
          PEER_EMAIL: ${{ secrets[format('ZZ_TEST_{0}_EMAIL', matrix.peer)] }}
          PEER_PASS: ${{ secrets[format('ZZ_TEST_{0}_PASS', matrix.peer)] }}
          NN: ${{ matrix.nn }}
          PEER: ${{ matrix.peer }}
        run: |
          missing=""
          for n in STAGING_USER STAGING_PASS SHO_ADMIN_EMAIL SHO_ADMIN_PASS SHO_MEMBER_EMAIL SHO_MEMBER_PASS SHO_QA_PASS; do
            [ -n "${!n}" ] || missing="$missing $n"
          done
          [ -n "$SHARD_EMAIL" ] || missing="$missing ZZ_TEST_${NN}_EMAIL"
          [ -n "$SHARD_PASS" ] || missing="$missing ZZ_TEST_${NN}_PASS"
          [ -n "$PEER_EMAIL" ] || missing="$missing ZZ_TEST_${PEER}_EMAIL"
          [ -n "$PEER_PASS" ] || missing="$missing ZZ_TEST_${PEER}_PASS"
          if [ -n "$missing" ]; then
            echo "::error::Shard $NN: missing repository secrets:$missing. Add them in Settings > Secrets and variables > Actions."
            exit 1
          fi
          echo "Shard $NN: all secrets are set (own account ZZ_TEST_$NN, partner ZZ_TEST_$PEER)."

      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium

      - name: Wait for this shard's sign-in slot
        env:
          SHARD: ${{ matrix.shard }}
          MAX_PARALLEL: ${{ inputs.max_parallel }}
        run: |
          wait=$(( (SHARD - 1) % MAX_PARALLEL * 15 ))
          echo "Shard $SHARD waits ${wait}s so shards do not all sign in at once."
          sleep "$wait"

      - name: Run shard ${{ matrix.shard }}/20 (workers=1)
        env:
          STAGING_USER: ${{ secrets.STAGING_USER }}
          STAGING_PASS: ${{ secrets.STAGING_PASS }}
          SHO_ADMIN_EMAIL: ${{ secrets.SHO_ADMIN_EMAIL }}
          SHO_ADMIN_PASS: ${{ secrets.SHO_ADMIN_PASS }}
          SHO_MEMBER_EMAIL: ${{ secrets.SHO_MEMBER_EMAIL }}
          SHO_MEMBER_PASS: ${{ secrets.SHO_MEMBER_PASS }}
          SHO_QA_PASS: ${{ secrets.SHO_QA_PASS }}
          QA_SLOT: ${{ matrix.nn }}
          SHARD_EMAIL: ${{ secrets[format('ZZ_TEST_{0}_EMAIL', matrix.nn)] }}
          SHARD_PASS: ${{ secrets[format('ZZ_TEST_{0}_PASS', matrix.nn)] }}
          PEER_EMAIL: ${{ secrets[format('ZZ_TEST_{0}_EMAIL', matrix.peer)] }}
          PEER_PASS: ${{ secrets[format('ZZ_TEST_{0}_PASS', matrix.peer)] }}
          PLAYWRIGHT_JSON_OUTPUT_FILE: playwright-report.json
          FILES: ${{ needs.plan.outputs.parallel }}
          TRACE: ${{ inputs.trace }}
        run: |
          read -ra files <<< "$FILES"
          # @static is a file-contains check. @manual cannot force a job failure on staging. Neither is a live pass.
          # @local-only specs sign up and verify new aliases from a local outbox: on staging that is real accounts and mail (APL-2925).
          npx playwright test --shard=${{ matrix.shard }}/20 --workers=1 --grep-invert "@static|@manual|@local-only" --reporter=list,blob,json --trace="$TRACE" "${files[@]}"

      - name: Fail this shard when every test was skipped
        if: always()
        run: |
          if [ ! -f scripts/ci/assert-playwright-ran.mjs ]; then
            printf '%s\n' '{"missing":true}' > playwright-counts.json
            echo "Missing Playwright JSON report (missing=true): count check script is not on disk."
            exit 0
          fi
          node scripts/ci/assert-playwright-ran.mjs --mode shard --report playwright-report.json --counts-out playwright-counts.json

      - name: Upload shard counts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-counts-${{ matrix.nn }}
          path: playwright-counts.json
          if-no-files-found: error
          retention-days: 14

      - name: Upload the blob report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: blob-report-${{ matrix.nn }}
          path: blob-report/
          if-no-files-found: ignore
          retention-days: 14

  e2e-serial:
    name: Serial specs (alone, after the shards)
    needs: [plan, e2e]
    if: ${{ !cancelled() && needs.plan.result == 'success' && needs.plan.outputs.serial != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      BASE_URL: ${{ needs.plan.outputs.base_url }}
      ZZ_PREFIX: ZZ-TEST-SERIAL
      PLAYWRIGHT_BLOB_OUTPUT_NAME: report-serial.zip
    steps:
      - name: Check the secrets are set (names only, never values)
        env:
          STAGING_USER: ${{ secrets.STAGING_USER }}
          STAGING_PASS: ${{ secrets.STAGING_PASS }}
          SHO_ADMIN_EMAIL: ${{ secrets.SHO_ADMIN_EMAIL }}
          SHO_ADMIN_PASS: ${{ secrets.SHO_ADMIN_PASS }}
          SHO_MEMBER_EMAIL: ${{ secrets.SHO_MEMBER_EMAIL }}
          SHO_MEMBER_PASS: ${{ secrets.SHO_MEMBER_PASS }}
          SHO_QA_PASS: ${{ secrets.SHO_QA_PASS }}
        run: |
          missing=""
          for n in STAGING_USER STAGING_PASS SHO_ADMIN_EMAIL SHO_ADMIN_PASS SHO_MEMBER_EMAIL SHO_MEMBER_PASS SHO_QA_PASS; do
            [ -n "${!n}" ] || missing="$missing $n"
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secrets:$missing. Add them in Settings > Secrets and variables > Actions."
            exit 1
          fi
          echo "All required secrets are set."

      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium

      - name: Run the serial specs (workers=1)
        env:
          STAGING_USER: ${{ secrets.STAGING_USER }}
          STAGING_PASS: ${{ secrets.STAGING_PASS }}
          SHO_ADMIN_EMAIL: ${{ secrets.SHO_ADMIN_EMAIL }}
          SHO_ADMIN_PASS: ${{ secrets.SHO_ADMIN_PASS }}
          SHO_MEMBER_EMAIL: ${{ secrets.SHO_MEMBER_EMAIL }}
          SHO_MEMBER_PASS: ${{ secrets.SHO_MEMBER_PASS }}
          SHO_QA_PASS: ${{ secrets.SHO_QA_PASS }}
          QA_SLOT: serial
          PLAYWRIGHT_JSON_OUTPUT_FILE: playwright-report.json
          FILES: ${{ needs.plan.outputs.serial }}
          TRACE: ${{ inputs.trace }}
        run: |
          read -ra files <<< "$FILES"
          # @static is a file-contains check. @manual cannot force a job failure on staging. Neither is a live pass.
          # @local-only specs sign up and verify new aliases from a local outbox: on staging that is real accounts and mail (APL-2925).
          npx playwright test --workers=1 --grep-invert "@static|@manual|@local-only" --reporter=list,blob,json --trace="$TRACE" "${files[@]}"

      - name: Fail the serial job when every test was skipped
        if: always()
        run: |
          if [ ! -f scripts/ci/assert-playwright-ran.mjs ]; then
            printf '%s\n' '{"missing":true}' > playwright-counts.json
            echo "Missing Playwright JSON report (missing=true): count check script is not on disk."
            exit 0
          fi
          node scripts/ci/assert-playwright-ran.mjs --mode shard --report playwright-report.json --counts-out playwright-counts.json

      - name: Upload serial counts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-counts-serial
          path: playwright-counts.json
          if-no-files-found: error
          retention-days: 14

      - name: Upload the blob report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: blob-report-serial
          path: blob-report/
          if-no-files-found: ignore
          retention-days: 14

  counts:
    name: Fail when nothing ran
    needs: [plan, e2e, e2e-serial]
    if: always() && inputs.probe != 'on'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: playwright-counts-*
          path: shard-counts
      - name: Merge the shard counts
        env:
          EXPECTED_COUNTS: ${{ needs.plan.outputs.expected_counts }}
        run: node scripts/ci/assert-playwright-ran.mjs --mode aggregate --dir shard-counts --expected "$EXPECTED_COUNTS"

  report:
    name: Merge the reports
    needs: [plan, e2e, e2e-serial]
    if: always() && inputs.probe != 'on'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - uses: actions/download-artifact@v4
        continue-on-error: true   # none at all is reported by the next step
        with:
          pattern: blob-report-*
          path: all-blob-reports
          merge-multiple: true

      - name: Merge into one HTML report
        run: |
          if ! ls all-blob-reports/*.zip >/dev/null 2>&1; then
            echo "::warning::No shard produced a blob report, so there is nothing to merge."; exit 0
          fi
          npx playwright merge-reports --reporter html ./all-blob-reports

      - name: Upload the HTML report
        uses: actions/upload-artifact@v4
        with:
          name: staging-e2e-report
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 14

  # Read-only identity probe (input "probe" = "on"). It exists because a TCP probe from a laptop cannot reach
  # the staging database, and this is the one approved way to ask the question from inside the network instead.
  # Nothing here writes: every request is a refusal path (a wrong password, an anonymous POST, a body the
  # product rejects), so a run leaves at most one LoginAttempt and one ActionLog per sign-in on an address that
  # owns no account. No pool account is signed in, no spec runs, and no report or trace is uploaded: a report can
  # carry a request body, and this job must be safe to hand to anyone who can read the run.
  # Credentials come from the repo's ordinary staging secrets (STAGING_USER / STAGING_PASS, the basic-auth
  # gate) and SHO_STAGING_PROBE_URL, which holds the probe target. Both are env-only and never echoed; the
  # request's status line, the table names behind the 401 and a hash of the throwaway address are the output.
  probe:
    name: Read-only identity probe
    if: inputs.probe == 'on'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # No `prisma generate`, no database: the probe talks to the app over HTTPS and nothing else.
      - name: Install dependencies (no scripts, no database)
        run: npm ci --ignore-scripts --no-audit --no-fund

      # The probe opens one connection to the staging database and runs four read-only queries: identity,
      # schema grants, database grants, max_connections. `SET default_transaction_read_only = on` is the first
      # statement after connect, and no DDL, DML, seed or migration exists in the script. The credential reaches
      # the process through a 0600 file it writes from an env-only value, never argv, and nothing in the run
      # prints it: the script strips it from every message and reports error codes only.
      - name: Probe the staging database identity and grants (read-only SQL)
        env:
          STAGING_DATABASE_URL: ${{ secrets.SHO_STAGING_PROBE_URL }}
        run: |
          if [[ -z "$STAGING_DATABASE_URL" ]]; then echo "::error::SHO_STAGING_PROBE_URL is not set."; exit 1; fi
          echo "::add-mask::$STAGING_DATABASE_URL"
          umask 077
          printf '%s' "$STAGING_DATABASE_URL" > "$RUNNER_TEMP/staging-url.secret"
          unset STAGING_DATABASE_URL
          SHO_CHECKOUT="$GITHUB_WORKSPACE" PROBE_URL_FILE="$RUNNER_TEMP/staging-url.secret" \
            node tests/e2e/tools/staging-isolation-probe.cjs
          rc=$?
          rm -f "$RUNNER_TEMP/staging-url.secret"
          case "$rc" in
            0) echo "::notice::ISOLATED.";;
            1) echo "::error::NOT-ISOLATED: a stop condition fired (see the stops list above).";;
            *) echo "::error::UNDETERMINED: the probe could not decide (exit $rc).";;
          esac
          exit "$rc"

      - name: Report the target shape, never a character of it
        env:
          STAGING_DATABASE_URL: ${{ secrets.SHO_STAGING_PROBE_URL }}
        run: |
          v="$STAGING_DATABASE_URL"
          echo "length=${#v}"
          echo "scheme=postgres$( [[ "$v" == postgresql://* ]] && echo ql )"
          echo "sslmode_present=$( [[ "$v" == *sslmode=* ]] && echo yes || echo no)"
          echo "has_linebreak=$( case "$v" in *$'\n'*|*$'\r'*) echo yes;; *) echo no;; esac )"
