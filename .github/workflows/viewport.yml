# APL-2662: every pull request to main runs the viewport suite in Playwright Chromium.
# GitHub reports this job's result as a check on the pull request.
# Throw-away Postgres and invented accounts only. No production or staging credential is read.
# GitHub sets GITHUB_ACTIONS=true, so Vitest prints each failing test name in the job log
# and as a check annotation (title= the test name).
name: Viewport

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: viewport-${{ github.ref }}
  cancel-in-progress: true

jobs:
  viewport:
    name: viewport
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: sho
          POSTGRES_PASSWORD: sho
          POSTGRES_DB: sho_viewport
        ports:
          - "5432:5432"
        options: "--health-cmd \"pg_isready -U sho\" --health-interval 5s --health-timeout 5s --health-retries 12"
    env:
      DATABASE_URL: postgresql://sho:sho@localhost:5432/sho_viewport?schema=public
      DIRECT_DATABASE_URL: postgresql://sho:sho@localhost:5432/sho_viewport?schema=public
      EMAIL_OUTBOX_DIR: ${{ github.workspace }}/.outbox-ci
      SUPER_ADMIN_EMAILS: root.test@aplyd.com
      APP_URL: http://localhost:3100
      TASKBOARD_URL: http://localhost:3100
      JOB_SECRET: ci-only-not-a-real-secret-0123
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.cache/ms-playwright
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Restore Playwright browsers
        id: playwright-browsers
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Install Playwright Chromium
        run: |
          if [ "${{ steps.playwright-browsers.outputs.cache-hit }}" = "true" ]; then
            echo "Playwright browsers restored from cache"
            npx playwright-core install-deps chromium
          else
            echo "No Playwright browser cache for this lockfile; downloading Chromium"
            npx playwright-core install --with-deps chromium
          fi
      - run: npx prisma migrate deploy
      - run: npm run build
      - name: Start the app
        run: |
          (npx next start -p 3100 > server.log 2>&1 &)
          url="${APP_HEALTH_URL:-http://localhost:3100/api/health}"
          attempts="${APP_HEALTH_ATTEMPTS:-30}"
          pause="${APP_HEALTH_PAUSE:-2}"
          for i in $(seq 1 "$attempts"); do
            if curl -fsS "$url"; then
              exit 0
            fi
            sleep "$pause"
          done
          echo "The app did not come up: ${url} did not answer within the timeout"
          tail -n 50 server.log || true
          exit 1
      - name: Viewport tests
        run: npm run test:viewport
      - name: Screenshots of failing pages
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: viewport-screenshots
          path: test-results/viewport/
          if-no-files-found: ignore
          retention-days: 14
      - name: Server log (on failure)
        if: failure()
        run: tail -n 200 server.log || true
