# APL-2925. Full story-spec regression against staging, in one job.
# Started by hand only (Actions > Staging regression > Run workflow). Never on push, pull_request or pull_request_target,
# so a fork cannot read these secrets.
#
# Steps: provision the verified alias pool (tests/e2e/tools/provision-aliases.ts --slots all, verifying each new alias on the
# server so no emailed link has to be clicked), then every Playwright spec in tests/e2e/stories except those tagged
# @local-only, then upload the counts and the evidence (if: always()). New specs are included by default.
#
# Excluded: @local-only (Dwight's ruling, APL-2925). APL-2609, APL-2669 and APL-2674 sign up brand-new nakul17+ aliases and
# verify them from the server's local mail outbox. On staging that would make real accounts and send real mail, then fail.
# They still run against a local server.
#
# Target: the repository variable STAGING_BASE_URL (not a secret), else https://staging.sheethappensofficer.com. Only staging
# or a pr1-pr4 preview is accepted; production is refused.
# Secrets (repository settings, set by Oscar):
#   STAGING_BASIC_USER, STAGING_BASIC_PASS   the basic-auth gate in front of staging
#   STAGING_JOB_SECRET                      staging's JOB_SECRET, for POST /api/qa/verify-alias (src/lib/qa-verify.ts).
#                                           Staging must also run with QA_VERIFY_ALIASES=1; anywhere else that route is 404.
#   SHO_QA_PASS, SHO_ADMIN_EMAIL, SHO_ADMIN_PASS, SHO_MEMBER_EMAIL, SHO_MEMBER_PASS   as in staging-e2e.yml
# They reach steps through env: only and are never echoed.
#
# Traces are OFF unless the "trace" input asks for them. A trace cannot be redacted: it holds the sign-in request body (the
# password) and the basic-auth header (STAGING_BASIC_USER:STAGING_BASIC_PASS in base64, which GitHub's log masking does not
# catch) (APL-2476). With traces on, the uploaded test-results artifact carries those secrets to anyone who can download it.
name: Staging regression

on:
  workflow_dispatch:
    inputs:
      trace:
        description: "Playwright traces. They contain passwords (see the comment at the top of this file)."
        required: false
        default: "off"
        type: choice
        options: ["off", "retain-on-failure"]

permissions:
  contents: read

# The same group as staging-e2e.yml: both use the alias pool and the shared staging database, so they never run at once.
concurrency:
  group: staging-e2e
  cancel-in-progress: false

env:
  BASE_URL: ${{ vars.STAGING_BASE_URL || 'https://staging.sheethappensofficer.com' }}
  # The only hosts a run may target: staging, or the preview slots pr1-pr4. Matched against the whole host.
  TARGET_ALLOWLIST: '^(staging\.sheethappensofficer\.com|pr[1-4]\.staging\.sheethappensofficer\.com)$'
  # Only for `prisma generate` during npm ci; nothing connects to it.
  DATABASE_URL: postgresql://unused:unused@127.0.0.1:1/unused
  DIRECT_DATABASE_URL: postgresql://unused:unused@127.0.0.1:1/unused
  PLAYWRIGHT_HTML_OPEN: never
  EXCLUDED_TAG: "@local-only"

jobs:
  staging-regression:
    name: staging-regression
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      ZZ_PREFIX: ZZ-TEST-REGRESSION
      # The serial slot of the pool. The shared concurrency group keeps staging-e2e's serial job from using it at the same time.
      QA_SLOT: serial
    steps:
      - name: Check the target host
        run: |
          if ! [[ "$BASE_URL" =~ ^https://([^/:]+)/?$ ]]; then
            echo "::error::STAGING_BASE_URL must be https://<host> with no path."; exit 1
          fi
          host="${BASH_REMATCH[1]}"
          if [[ "${host,,}" =~ ^(www\.|app\.)?sheethappensofficer\.com\.?$ ]]; then
            echo "::error::Refusing to run against production ($host)."; exit 1
          fi
          if ! [[ "$host" =~ $TARGET_ALLOWLIST ]]; then
            echo "::error::Target '$host' is not allowed. Use staging.sheethappensofficer.com or pr1-pr4.staging.sheethappensofficer.com."; exit 1
          fi
          echo "Target: https://$host"

      - name: Check the secrets are set (names only, never values)
        env:
          STAGING_BASIC_USER: ${{ secrets.STAGING_BASIC_USER }}
          STAGING_BASIC_PASS: ${{ secrets.STAGING_BASIC_PASS }}
          QA_JOB_SECRET: ${{ secrets.STAGING_JOB_SECRET }}
          SHO_ADMIN_EMAIL: ${{ secrets.SHO_ADMIN_EMAIL }}
          SHO_ADMIN_PASS: ${{ secrets.SHO_ADMIN_PASS }}
          SHO_MEMBER_EMAIL: ${{ secrets.SHO_MEMBER_EMAIL }}
          SHO_MEMBER_PASS: ${{ secrets.SHO_MEMBER_PASS }}
          SHO_QA_PASS: ${{ secrets.SHO_QA_PASS }}
        run: |
          missing=""
          for n in STAGING_BASIC_USER STAGING_BASIC_PASS SHO_ADMIN_EMAIL SHO_ADMIN_PASS SHO_MEMBER_EMAIL SHO_MEMBER_PASS SHO_QA_PASS; do
            [ -n "${!n}" ] || missing="$missing $n"
          done
          [ -n "$QA_JOB_SECRET" ] || missing="$missing STAGING_JOB_SECRET"
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secrets:$missing. Add them in Settings > Secrets and variables > Actions."
            exit 1
          fi
          echo "All required secrets are set."

      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium

      - name: Provision the alias pool (all slots, verified on the server)
        env:
          # The scripts and playwright.config.ts read the basic-auth pair as STAGING_USER / STAGING_PASS.
          STAGING_USER: ${{ secrets.STAGING_BASIC_USER }}
          STAGING_PASS: ${{ secrets.STAGING_BASIC_PASS }}
          SHO_QA_PASS: ${{ secrets.SHO_QA_PASS }}
          QA_JOB_SECRET: ${{ secrets.STAGING_JOB_SECRET }}
        # The script prints addresses and states only, and refuses to print any line that contains a secret.
        run: npx tsx tests/e2e/tools/provision-aliases.ts --slots all

      - name: Run the full suite except ${{ env.EXCLUDED_TAG }} (workers=1)
        env:
          STAGING_USER: ${{ secrets.STAGING_BASIC_USER }}
          STAGING_PASS: ${{ secrets.STAGING_BASIC_PASS }}
          SHO_ADMIN_EMAIL: ${{ secrets.SHO_ADMIN_EMAIL }}
          SHO_ADMIN_PASS: ${{ secrets.SHO_ADMIN_PASS }}
          SHO_MEMBER_EMAIL: ${{ secrets.SHO_MEMBER_EMAIL }}
          SHO_MEMBER_PASS: ${{ secrets.SHO_MEMBER_PASS }}
          SHO_QA_PASS: ${{ secrets.SHO_QA_PASS }}
          PLAYWRIGHT_JSON_OUTPUT_FILE: playwright-report.json
          TRACE: ${{ inputs.trace }}
        run: npx playwright test --workers=1 --grep-invert "$EXCLUDED_TAG" --reporter=list,html,json --trace="$TRACE"

      - name: Count the results
        if: always()
        run: |
          if [ ! -f playwright-report.json ]; then
            printf '%s\n' '{"missing":true}' > playwright-counts.json
            echo "::error::Missing Playwright JSON report: the suite did not run."
            exit 1
          fi
          node scripts/ci/assert-playwright-ran.mjs --mode shard --report playwright-report.json --counts-out playwright-counts.json

      - name: Write the summary
        if: always()
        run: |
          # shellcheck disable=SC2016 # the ${...} below is a JavaScript template literal, not shell
          {
            echo "## Staging regression ($BASE_URL)"
            if [ -f playwright-counts.json ]; then
              node -e '
                const c = JSON.parse(require("fs").readFileSync("playwright-counts.json", "utf8"));
                if (c.missing) console.log("**Counts:** missing (no Playwright JSON report).");
                else console.log(`**Counts:** total ${c.total}, run ${c.run}, passed ${c.expected}, failed ${c.unexpected}, flaky ${c.flaky}, skipped ${c.skipped}`);
              '
            else
              echo "**Counts:** none (the job stopped before the suite ran; see the provisioning step)."
            fi
            echo
            echo "**Excluded ($EXCLUDED_TAG):** APL-2609, APL-2669, APL-2674. They sign up new nakul17+ aliases and verify them"
            echo "from a local mail outbox, so on staging they would create real accounts and send real mail. They run locally only."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the counts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: staging-regression-counts
          path: |
            playwright-counts.json
            playwright-report.json
          if-no-files-found: warn
          retention-days: 14

      - name: Upload the evidence (HTML report, test results, traces when turned on)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: staging-regression-evidence
          path: |
            playwright-report/
            test-results/
          if-no-files-found: warn
          retention-days: 14
