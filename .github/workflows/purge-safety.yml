# SHO-2625: isolated CI only. No application deployment or real staging credentials.
name: Staging purge safety
on:
  pull_request:
permissions:
  contents: read
concurrency:
  group: purge-safety-${{ github.ref }}
  cancel-in-progress: true
jobs:
  purge:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: sho
          POSTGRES_PASSWORD: sho
          POSTGRES_DB: sho_staging
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U sho -d sho_staging"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgresql://sho:sho@localhost:5432/sho_staging?schema=purge_ci
      DIRECT_DATABASE_URL: postgresql://sho:sho@localhost:5432/sho_staging?schema=purge_ci
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma migrate deploy
      - run: npx vitest run -c vitest.purge.config.mts
