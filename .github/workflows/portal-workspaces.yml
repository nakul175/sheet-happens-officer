name: Portal additional workspace foundation
on: [pull_request]
permissions:
  contents: read
jobs:
  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: fixture
          POSTGRES_PASSWORD: synthetic-ci-only
          POSTGRES_DB: portal_workspace_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U fixture" --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx prisma validate
        env:
          DATABASE_URL: postgresql://fixture:synthetic-ci-only@localhost:5432/portal_workspace_test
          DIRECT_DATABASE_URL: postgresql://fixture:synthetic-ci-only@localhost:5432/portal_workspace_test
      - run: node --test scripts/portal-workspaces/workspaces.test.mjs
        env:
          SHO_WORKSPACE_TEST_DATABASE_URL: postgresql://fixture:synthetic-ci-only@localhost:5432/portal_workspace_test
