name: Portal organisation role transactions
on: [pull_request]
permissions:
  contents: read
jobs:
  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: fixture
          POSTGRES_PASSWORD: synthetic-ci-only
          POSTGRES_DB: portal_org_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U fixture" --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: node --test scripts/portal-org/bridge.test.mjs
        env:
          SHO_ORG_TEST_DATABASE_URL: postgresql://fixture:synthetic-ci-only@localhost:5432/portal_org_test
