# SHO-US-22.11: phone-size checks on all screens and widths (tests/viewport).
# Pull requests run only when the diff can change the UI or this suite. Push to main and qa/story-e2e, and manual runs, always run the same checks.
# It fails naming the screen, width and element, and keeps a screenshot of each failing page (download "viewport-screenshots" from the run).
# Uses its own throw-away Postgres and invented accounts; it never reaches the production database or any real data.
name: Phone checks

# Push only on main and qa/story-e2e. Other branches run through pull_request, so a push to a PR branch does not start a second run.
# paths is an include list: a pull request that does not touch these files does not start Phone. src/ and the other UI inputs still do.
on:
  pull_request:
    paths:
      - src/**
      - public/**
      - vendor/**
      - package.json
      - package-lock.json
      - prisma/**
      - next.config.*
      - tests/viewport/**
      - vitest.viewport.config.mts
      - .github/workflows/phone-checks.yml
  push:
    branches: [main, qa/story-e2e]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  # A run for refs/heads/main is never cancelled. Every other ref cancels the previous run in this group.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  viewport:
    name: Phone-size layout checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: sho
          POSTGRES_PASSWORD: sho
          POSTGRES_DB: sho_viewport
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U sho"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgresql://sho:sho@localhost:5432/sho_viewport?schema=public
      DIRECT_DATABASE_URL: postgresql://sho:sho@localhost:5432/sho_viewport?schema=public
      EMAIL_OUTBOX_DIR: ${{ github.workspace }}/.outbox-ci
      SUPER_ADMIN_EMAILS: root.test@aplyd.com
      APP_URL: http://localhost:3100
      TASKBOARD_URL: http://localhost:3100
      JOB_SECRET: ci-only-not-a-real-secret-0123
      # The product default is off. Phone checks turn the return path on so the story can run.
      SIGNIN_RETURN_TO: "on"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Playwright core version
        id: playwright-core-version
        run: |
          version="$(node -p "require('./package-lock.json').packages['node_modules/playwright-core'].version")"
          if [ -z "$version" ] || [ "$version" = "undefined" ]; then
            echo "playwright-core version missing from package-lock.json" >&2
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "playwright-core ${version}"
      - name: Cache Playwright Chromium
        id: ms-playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ms-playwright-${{ runner.os }}-${{ steps.playwright-core-version.outputs.version }}
      - run: npm ci
      - run: npx prisma migrate deploy
      - run: npm run build
      - name: Install Playwright Chromium
        run: |
          if [ "${{ steps.ms-playwright-cache.outputs.cache-hit }}" = "true" ]; then
            echo "Chromium cache hit for playwright-core ${{ steps.playwright-core-version.outputs.version }}; installing system libraries only"
            npx playwright-core install-deps chromium
          else
            echo "Chromium cache miss; downloading"
            npx playwright-core install --with-deps chromium
          fi
      - name: Start the app
        run: |
          (npx next start -p 3100 > server.log 2>&1 &)
          for i in $(seq 1 30); do curl -fsS http://localhost:3100/api/health && break; sleep 2; done
      - name: Phone checks
        run: npm run test:viewport
      - name: Screenshots of failing pages
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: viewport-screenshots
          path: test-results/viewport/
          if-no-files-found: ignore
          retention-days: 14
      - name: Server log (on failure)
        if: failure()
        run: tail -n 200 server.log || true
