# SHO-US-22.11: every change runs the phone-size checks on all screens and widths (tests/viewport).
# It fails naming the screen, width and element, and keeps a screenshot of each failing page (download "viewport-screenshots" from the run).
# Uses its own throw-away Postgres and invented accounts; it never reaches the production database or any real data.
#
# SHO-2559: the browser tier (tests/browser-tier, `npm run test:browser`, vitest.browser-tier.config.mts) drives a real
# Chromium the same way and ran in NO workflow, so its files could break with nothing turning red. The `browser` job
# below is that tier's wiring: same throw-away database, same invented accounts, no credential. tests/ci-phone-checks-2559.test.ts
# fails if any Chromium tier in package.json is left unwired again.
name: Phone checks

# Push only on main and qa/story-e2e. Other branches run through pull_request, so a push to a PR branch does not start a second run.
on:
  pull_request:
  push:
    branches: [main, qa/story-e2e]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  # A run for refs/heads/main is never cancelled. Every other ref cancels the previous run in this group.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  viewport:
    name: Phone-size layout checks
    runs-on: ubuntu-latest
    # 20 minutes, the same budget viewport.yml gives this job's sibling. The browser download is not bounded by anything
    # this job controls: it took 0.3 min on one runner and 8-10 min on another.
    # No test is skipped, retried or weakened.
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: sho
          POSTGRES_PASSWORD: sho
          POSTGRES_DB: sho_viewport
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U sho"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgresql://sho:sho@localhost:5432/sho_viewport?schema=public
      DIRECT_DATABASE_URL: postgresql://sho:sho@localhost:5432/sho_viewport?schema=public
      EMAIL_OUTBOX_DIR: ${{ github.workspace }}/.outbox-ci
      SUPER_ADMIN_EMAILS: root.test@aplyd.com
      APP_URL: http://localhost:3100
      TASKBOARD_URL: http://localhost:3100
      JOB_SECRET: ci-only-not-a-real-secret-0123
      # The product default is off. Phone checks turn the return path on so the story can run.
      SIGNIN_RETURN_TO: "on"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The cache is only a shortcut, so a hit cannot decide what gets installed. The browser AND chromium-headless-shell
      # (which `chromium.launch()` uses by default) are both downloaded here, every time. On a slow runner this download is
      # what the 20-minute budget has to absorb.
      - name: Install Playwright Chromium
        run: npx playwright-core install --with-deps chromium
      - run: npx prisma migrate deploy
      - run: npm run build
      - name: Start the app
        run: |
          (npx next start -p 3100 > server.log 2>&1 &)
          for i in $(seq 1 30); do curl -fsS http://localhost:3100/api/health && break; sleep 2; done
      - name: Phone checks
        run: npm run test:viewport
      - name: Screenshots of failing pages
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: viewport-screenshots
          path: test-results/viewport/
          if-no-files-found: ignore
          retention-days: 14
      - name: Server log (on failure)
        if: failure()
        run: tail -n 200 server.log || true

  # SHO-2559: the browser tier. Seven Vitest files that drive Playwright Chromium against the app on 3100
  # (tests/apl-2770-long-assignee.test.ts, tests/e2e/local/APL-2739.test.ts, tests/e2e/stories/APL-2736.spec.ts,
  # tests/activity-delete-undo.test.ts, tests/inline-touch-2673.test.ts, tests/forced-password-23-5-browser.test.ts,
  # tests/e2e/local/APL-2719.test.ts). They are excluded from `npm test` because 9 of their tests hit that run's
  # 30s testTimeout; vitest.browser-tier.config.mts gives them 120s. A separate job, not a second step in the job
  # above, so neither tier's timing or failure hides the other's.
  browser:
    name: Browser-tier checks (Chromium)
    runs-on: ubuntu-latest
    # 25 minutes: the checkout, npm ci, the Chromium download (8-10 min on a slow runner), the build and then the
    # tier itself, whose files first-paint several routes. No test is skipped, retried or weakened.
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: sho
          POSTGRES_PASSWORD: sho
          POSTGRES_DB: sho_test_browser
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U sho"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgresql://sho:sho@localhost:5432/sho_test_browser?schema=public
      DIRECT_DATABASE_URL: postgresql://sho:sho@localhost:5432/sho_test_browser?schema=public
      EMAIL_OUTBOX_DIR: ${{ github.workspace }}/.outbox-ci
      SUPER_ADMIN_EMAILS: root.test@aplyd.com
      APP_URL: http://localhost:3100
      TASKBOARD_URL: http://localhost:3100
      JOB_SECRET: ci-only-not-a-real-secret-0123
      # The product default is off. tests/forced-password-23-5-browser.test.ts signs in through the return path.
      SIGNIN_RETURN_TO: "on"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Downloaded every run, as in the phone job above: the browser build is cheap next to a run that cannot
      # start Chromium, and a cache keyed on the lockfile cannot decide which binary the tier gets.
      - name: Install Playwright Chromium
        run: npx playwright-core install --with-deps chromium
      # The tier does not use Playwright's default binary: its files fall back to a system
      # /usr/bin/google-chrome and fail before any test when that is absent (tests/activity-delete-undo.test.ts:25,
      # tests/apl-2770-long-assignee.test.ts:39, tests/forced-password-23-5-browser.test.ts:25, tests/inline-touch-2673.test.ts:19),
      # which is exactly the ubuntu-latest case. PW_CHROMIUM is the variable all of them read first, so it points at the
      # Chromium installed above and the job fails loudly if that binary is missing.
      - name: Point the tier at the Chromium it installed
        run: |
          chrome="$(node -p "require('playwright-core').chromium.executablePath()")"
          if [ ! -x "$chrome" ]; then
            echo "::error::The Playwright Chromium is not executable at $chrome"
            exit 1
          fi
          echo "PW_CHROMIUM=$chrome" >> "$GITHUB_ENV"
          echo "The browser tier launches: $chrome"
      - run: npx prisma migrate deploy
      - run: npm run build
      - name: Start the app
        run: |
          (npx next start -p 3100 > server.log 2>&1 &)
          url="${APP_HEALTH_URL:-http://localhost:3100/api/health}"
          attempts="${APP_HEALTH_ATTEMPTS:-30}"
          pause="${APP_HEALTH_PAUSE:-2}"
          ready=0
          for i in $(seq 1 "$attempts"); do
            if curl -fsS "$url"; then
              ready=1
              break
            fi
            sleep "$pause"
          done
          if [ "$ready" -ne 1 ]; then
            echo "The app did not come up: ${url} did not answer within the timeout" >&2
            tail -n 50 server.log >&2 || true
            exit 1
          fi
      - name: Browser tier
        run: npm run test:browser
      - name: Screenshots of failing pages
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-tier-screenshots
          path: test-results/
          if-no-files-found: ignore
          retention-days: 14
      - name: Server log (on failure)
        if: failure()
        run: tail -n 200 server.log || true
