name: Restore check

# Manual run after a backup has been restored to a temporary cluster (story 9.3, AC3).
# Needs the secret RESTORE_DATABASE_URL (the temporary cluster's private connection string).
# The temporary cluster must trust the sho-app droplet. Read-only: counts rows in both databases.
on:
  workflow_dispatch:

jobs:
  compare:
    runs-on: ubuntu-latest
    env:
      HOST: ${{ vars.DROPLET_HOST || 'sheethappensofficer.aplyd.org' }}
      HOST_KEY: ${{ vars.DROPLET_HOST_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: SSH key
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          [ -n "$HOST_KEY" ] || { echo "Verified DROPLET_HOST_KEY is required"; exit 1; }
          printf '%s\n' "$HOST_KEY" > ~/.ssh/known_hosts
          ssh-keygen -F "$HOST" -f ~/.ssh/known_hosts >/dev/null
      - name: Compare
        env:
          RESTORE_DATABASE_URL: ${{ secrets.RESTORE_DATABASE_URL }}
        run: |
          set -euo pipefail
          [ -n "$RESTORE_DATABASE_URL" ] || { echo "RESTORE_DATABASE_URL secret is missing"; exit 1; }
          [[ "$GITHUB_RUN_ID" =~ ^[0-9]+$ && "$GITHUB_RUN_ATTEMPT" =~ ^[0-9]+$ ]] || { echo "Invalid run identity"; exit 1; }
          remote_dir="/tmp/sho-restore-check-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          cleanup() { ssh -o StrictHostKeyChecking=yes "deploy@$HOST" "rm -rf -- '$remote_dir'" || true; }
          trap cleanup EXIT
          ssh -o StrictHostKeyChecking=yes "deploy@$HOST" "test -r /opt/sho/current/node_modules/pg/package.json && umask 077 && mkdir -m 700 -- '$remote_dir'"
          scp -o StrictHostKeyChecking=yes deploy/restore-check.cjs deploy/restore-assessment.cjs deploy/restore-connection.cjs deploy/restore-target.cjs deploy/restore-observation.cjs "deploy@$HOST:$remote_dir/"
          printf '%s\n' "$RESTORE_DATABASE_URL" | ssh -o StrictHostKeyChecking=yes "deploy@$HOST" "cd '$remote_dir' && NODE_PATH=/opt/sho/current/node_modules node restore-check.cjs"
      - name: Clean up
        if: always()
        run: |
          [[ "$GITHUB_RUN_ID" =~ ^[0-9]+$ && "$GITHUB_RUN_ATTEMPT" =~ ^[0-9]+$ ]] || exit 0
          ssh -o StrictHostKeyChecking=yes "deploy@$HOST" "rm -rf -- '/tmp/sho-restore-check-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}'" || true
