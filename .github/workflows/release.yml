# Tags rel-YYYY.MM.DD.N deploy the tarball already built for that commit.
# rel-test-* does not match this workflow. Rehearsals use rehearse.yml and never SSH.
#
# NJ creates the GitHub environment named "production" before the first tag
# (Settings > Environments). It is not created by this file. Set:
#   - Required reviewer: nakul175
#   - Prevent self-review: on
#   - Deployment branches and tags: allow the rel-* tags. Do not limit this
#     environment to the main branch, or a rel-* tag cannot deploy.
# Environment secrets, same names as today: DATABASE_URL (PgBouncer port 25061,
# pgbouncer=true), DIRECT_DATABASE_URL (direct database, required).
# A contract migration is allowed only by running this workflow by hand from the
# tag with allow_contract_migration set. A repository variable cannot skip the marker.
# Also create an active tag ruleset that restricts creating refs/tags/rel-*
# to the release managers (sample: deploy/rel-tag-ruleset.json).
# QA records the decision on the commit before the tag deploys:
#   context qa/gate, state success, description "READY <digest>" or
#   "WITH_EXCEPTION <digest>", and creator.login equal to the variable QA_GATE_LOGIN.
# The digest is the staging/digest status. QA_GATE_LOGIN must be a person.
name: Release to production

on:
  push:
    tags:
      - "rel-*"
      - "!rel-test-*"
  workflow_dispatch:
    inputs:
      allow_contract_migration:
        description: Allow a pending migration that is not marked expand-only
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  actions: write
  statuses: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  ship:
    uses: ./.github/workflows/ship.yml
    with:
      tier: production
      allow_contract_migration: ${{ github.event_name == 'workflow_dispatch' && inputs.allow_contract_migration }}
    secrets:
      SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      SMOKE_EMAIL: ${{ secrets.SMOKE_EMAIL }}
      SMOKE_PASSWORD: ${{ secrets.SMOKE_PASSWORD }}
