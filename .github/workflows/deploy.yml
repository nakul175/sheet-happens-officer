# A push to main deploys to staging only (/opt/sho-staging). It does not write
# /etc/sho/app.env, restart sho, or copy a release into /opt/sho.
# Production is .github/workflows/release.yml, on tags rel-*, after the production
# environment's required reviewer approves.
#
# Staging secrets (repository): STAGING_DATABASE_URL (required), STAGING_DIRECT_DATABASE_URL
# (optional; migrations fall back to STAGING_DATABASE_URL), RESEND_API_KEY, SSH_PRIVATE_KEY.
# Optional: ANTHROPIC_API_KEY and the MODEL_* variables. STAGING_DATABASE_URL must be the
# staging database, not the production PgBouncer pool.
name: Test and deploy to staging

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  ship:
    uses: ./.github/workflows/ship.yml
    with:
      tier: staging
    secrets: inherit
