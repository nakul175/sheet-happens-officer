# Test main pushes. Production release requires explicit manual dispatch and approval.
# Production deploy secret: SSH_PRIVATE_KEY. RESEND_API_KEY is only for failure notification.
# Database/identity configuration stays on the host and is never written by this workflow.
# Optional variables: DROPLET_HOST (defaults to the app address), DROPLET_HOST_KEY (ssh-keyscan line).
name: Test and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy:
        description: "Request an approved app-only production release (no migrations or schedules)"
        type: boolean
        default: false
      approved_sha:
        description: "Exact full commit SHA approved for this release"
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: release-main
  cancel-in-progress: false

env:
  APP_HOST: sheethappensofficer.aplyd.org

jobs:
  test:
    uses: ./.github/workflows/qualification.yml
  phone:
    uses: ./.github/workflows/phone-checks.yml

  deploy:
    name: Release to the droplet
    needs: [test, phone]
    if: github.event_name == 'workflow_dispatch' && inputs.deploy == true && github.ref == 'refs/heads/main'
    environment: production
    runs-on: ubuntu-latest
    env:
      HOST: ${{ vars.DROPLET_HOST || 'sheethappensofficer.aplyd.org' }}
      HOST_KEY: ${{ vars.DROPLET_HOST_KEY }}
    steps:
      - name: Require exact approved revision
        env:
          APPROVED_SHA: ${{ inputs.approved_sha }}
        run: |
          [[ "$APPROVED_SHA" =~ ^[0-9a-f]{40}$ ]] && [ "$APPROVED_SHA" = "$GITHUB_SHA" ] || { echo "::error::Exact SHA approval required"; exit 1; }
      - uses: actions/checkout@v4
      - name: SSH key
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          if [ -n "$HOST_KEY" ]; then
            printf '%s\n' "$HOST_KEY" > ~/.ssh/known_hosts
          else
            echo "::warning::DROPLET_HOST_KEY is not set; trusting the host key seen now"
            ssh-keyscan -H "$HOST" > ~/.ssh/known_hosts 2>/dev/null
          fi
      - name: Upload the release
        run: >-
          rsync -az --delete
          --exclude .git --exclude node_modules --exclude .next --exclude '.env*' --exclude '.outbox*'
          ./ "deploy@$HOST:/opt/sho/releases/$GITHUB_SHA/"
      # App cuts use existing host configuration. Secret/configuration provisioning is
      # a separate approved operation; never rewrite app.env from repository secrets.
      - name: Release
        run: ssh "deploy@$HOST" "bash /opt/sho/releases/$GITHUB_SHA/deploy/release.sh $GITHUB_SHA"
      - name: Email the owner if the release failed
        if: failure()
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        # APL-2929: the sender stays on the old domain until Resend verifies sheethappensofficer.aplyd.org.
        run: |
          curl -sS -o /dev/null -w "owner email: HTTP %{http_code}\n" https://api.resend.com/emails \
            -H "Authorization: Bearer $RESEND_API_KEY" -H "Content-Type: application/json" \
            -d "{\"from\":\"Sheet Happens Officer <no-reply@sheethappensofficer.com>\",\"to\":[\"nakul.jain@aplyd.com\"],\"subject\":\"SHO release failed (previous release restored if the app was switched)\",\"text\":\"The release of ${GITHUB_SHA::7} failed. If the health check failed, the previous release was restored automatically. Details: $RUN_URL\"}" || true
