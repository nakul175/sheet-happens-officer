name: HOLY-4 four-user workspace and failure-retry acceptance
on:
  workflow_dispatch:
    inputs:
      expected_sho_sha:
        type: string
        required: true
permissions:
  contents: read
concurrency:
  group: holy4-matrix
  cancel-in-progress: false
defaults:
  run:
    shell: bash
jobs:
  matrix:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      HOLY4_MATRIX: "1"
      HOLY4_FIXTURE_FILE: ${{ github.workspace }}/.holy3062-login.json
      HOLY4_EXPECTED_SHA: ${{ inputs.expected_sho_sha }}
      PW_CHROMIUM: /usr/bin/google-chrome
      STAGING_USER: ${{ secrets.STAGING_USER }}
      STAGING_PASS: ${{ secrets.STAGING_PASS }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Refuse a different runtime candidate or missing existing gate credential
        run: |
          [[ "$HOLY4_EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          git merge-base --is-ancestor "$HOLY4_EXPECTED_SHA" "$GITHUB_SHA"
          node --input-type=module - <<'JS'
          import {execFileSync} from 'node:child_process';
          const allowed=new Set(['tests/qa/holy4-matrix.spec.ts','.github/workflows/holy4-matrix-validation.yml','playwright.holy4-matrix.config.ts']);
          const files=execFileSync('git',['diff','--name-only',process.env.HOLY4_EXPECTED_SHA,process.env.GITHUB_SHA],{encoding:'utf8'}).trim().split('\n').filter(Boolean);
          if(files.some(file=>!allowed.has(file)))throw Error('Live test source differs from the tested runtime');
          JS
          test -n "$STAGING_USER" && test -n "$STAGING_PASS"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Configure existing SSH identity with a pinned host key
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          HOST_KEY: ${{ vars.DROPLET_HOST_KEY }}
        run: |
          test -n "$HOST_KEY"
          umask 077
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$HOST_KEY" > ~/.ssh/known_hosts
      - name: Retrieve only the reviewed temporary synthetic login fixture
        run: |
          umask 077
          ssh -o StrictHostKeyChecking=yes -o BatchMode=yes deploy@168.144.144.69 'cat /home/deploy/holy4-matrix-ops/fixture-private.json' > "$HOLY4_FIXTURE_FILE"
      - name: Real paired normal-login workflow and permission revocation
        run: npx playwright test -c playwright.holy4-matrix.config.ts | tee holy4-matrix.log
      - name: Preserve the private ID receipt only on the host
        if: always()
        run: |
          if [ -f test-results/holy4-matrix-private-receipt.json ]; then
            ssh -o StrictHostKeyChecking=yes -o BatchMode=yes deploy@168.144.144.69 'umask 077; cat > /home/deploy/holy4-matrix-ops/execution-receipt.json' < test-results/holy4-matrix-private-receipt.json
          fi
          rm -f "$HOLY4_FIXTURE_FILE"
      - name: Save non-secret screenshots and bounded result summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: holy4-matrix-${{ github.sha }}
          path: |
            test-results/holy4-matrix-public-summary.json
            test-results/holy4-matrix-*.png
